<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Generator Builder</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
    input, button { padding: 10px; font-size: 16px; width: 100%; margin-bottom: 10px; }
    img { max-width: 100%; margin-top: 10px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>AI Image Generator</h2>
  <input type="text" id="promptInput" placeholder="Masukkan prompt gambar..."/>
  <button onclick="generateImage()">Generate</button>
  <div id="output"></div>

  <script>
    async function generateImage() {
      const prompt = document.getElementById("promptInput").value;
      const output = document.getElementById("output");
      output.innerHTML = "Loading...";

      try {
        const response = await fetch("https://api.replicate.com/v1/predictions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Token r8_N3EZ748fDphEN06OqzsyOQKdJYS8mDX4Q3Emp"
          },
          body: JSON.stringify({
            version: "db21e45c5a0e5196c80e3a61b8a3f80e1e7f1326b6e47c1c9c7af26dfec10291", // contoh model SDXL
            input: { prompt: prompt }
          })
        });

        const prediction = await response.json();
        const statusUrl = prediction.urls.get;

        // Cek status hingga selesai
        let result = null;
        while (!result || result.status !== "succeeded") {
          await new Promise(r => setTimeout(r, 2000));
          const res = await fetch(statusUrl, {
            headers: {
              "Authorization": "Token r8_N3EZ748fDphEN06OqzsyOQKdJYS8mDX4Q3Emp"
            }
          });
          result = await res.json();
        }

        output.innerHTML = `<img src="${result.output[0]}" alt="Generated Image" />`;

      } catch (err) {
        output.innerHTML = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
